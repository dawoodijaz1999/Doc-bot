<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <header class="page-header" role="banner">
      <h1 class="project-name"><a href="{{ '/' | relative_url }}" style="color:inherit">{{ site.title }}</a></h1>
      <h2 class="project-tagline">{{ site.description }}</h2>
    </header>

    <main id="content" class="main-content" role="main">
      {{ content }}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script>
      // Kramdown/Rouge renders ```mermaid as either <pre><code class="language-mermaid">
      // or <div class="language-mermaid highlighter-rouge"><div><pre><code>. Handle both.
      document.querySelectorAll('pre > code.language-mermaid, div.language-mermaid pre > code').forEach(function (code) {
        var target = code.closest('div.language-mermaid') || code.parentElement;
        var div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code.textContent;
        target.replaceWith(div);
      });
      mermaid.initialize({ startOnLoad: false });
      mermaid.run({ querySelector: '.mermaid' });
    </script>
  </body>
</html>

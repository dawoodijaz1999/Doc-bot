name: docs-all

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-all
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Generate docs for all repos
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INCLUDE_PRIVATE: "false"
          MAX_REPOS_PER_RUN: "10"
        run: python .github/scripts/docbot_all.py

      - name: Commit if changed
        run: |
          git config user.name "docbot"
          git config user.email "docbot@users.noreply.github.com"
          git add docs state.json README.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "docs: update product docs [skip ci]"
            git pull --rebase
            git push
          fi
